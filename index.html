<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #880e4f;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 2.8em;
      margin: 0 20px 40px;
      animation: heartbeat 1.8s infinite;
      line-height: 1.2;
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.12); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12); }
      70% { transform: scale(1); }
    }
    button {
      font-size: 2.5em;
      padding: 20px 70px;
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(233, 30, 99, 0.4);
      transition: all 0.3s ease;
    }
    button:active {
      transform: scale(0.95);
    }
    #player {
      display: none;
      max-width: 95%;
      max-height: 65vh;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      margin-top: 30px;
    }
    .fallback {
      font-size: 1.2em;
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Hey love... will you accept this little surprise? 🐰</h1>
  
  <button id="yes">Yes! ❤️</button>

  <video id="player" controls autoplay playsinline loop>
    <source src="jellycat-valentine.mp4" type="video/mp4">
    <!-- If name is still capitalized or different, change to exact match e.g. src="Jellycat-valentine.mp4.mp4" -->
    <p class="fallback">Video loading... if it doesn't play, tap the screen or refresh ❤️</p>
  </video>

  <script>
    document.getElementById('yes').addEventListener('click', function() {
      document.querySelector('h1').innerHTML = "For you. With love ❤️ 🐰";
      this.style.display = 'none';
      
      const video = document.getElementById('player');
      video.style.display = 'block';
      video.muted = false;
      video.load();  // Reload source
      video.play().catch(e => {
        console.log("Play error:", e);
        // Mobile often needs manual tap
        alert("Tap the video to start playing – love you! ❤️");
      });
    });
  </script>

</body>
</html>
